<!doctype html>
<html>

<head>
    <title>MicroProjetAR - 3D</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; changeMatrixMode: modelViewMatrix; sourceWidth: 800; sourceHeight: 600; displayWidth: 1280; displayHeight: 720;"
        vr-mode-ui="enabled: false"
        renderer="sortObjects: true; antialias: true; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true;">

        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="1 3 2" intensity="2"></a-light>

        <a-assets>
            <a-asset-item id="monModele3D" src="./assets/tentacules_4_coins_sol.glb"></a-asset-item>
        </a-assets>

        <a-marker type="barcode" value="0" smooth="true" smoothCount="5" smoothTolerance="0.05" smoothThreshold="5">
            <a-entity scale="0.2 0.2 0.2" position="0 0 0" gltf-model="#monModele3D"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
