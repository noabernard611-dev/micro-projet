<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Project Initial - 4 Tentacules 3D AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <script>
      AFRAME.registerComponent('animer-tentacules-obj', {
        schema: {
          couleur: { type: 'color', default: '#7b2cbf' },
          vitesse: { type: 'number', default: 2.5 },
          amplitude: { type: 'number', default: 0.35 }
        },
        init: function () {
          this.maillages = [];
          const d = this.data;

          this.el.addEventListener('model-loaded', (e) => {
            const modele = e.detail.model;
            modele.traverse((enfant) => {
              if (enfant.isMesh && enfant.geometry && enfant.geometry.attributes.position) {
                enfant.material = new THREE.MeshStandardMaterial({
                  color: d.couleur,
                  roughness: 0.35,
                  metalness: 0.2
                });

                const pos = enfant.geometry.attributes.position;
                this.maillages.push({
                  posAttr: pos,
                  original: new Float32Array(pos.array)
                });
              }
            });
          });
        },
        tick: function (time) {
          if (this.maillages.length === 0) return;
          const t = time * 0.001 * this.data.vitesse;
          const amp = this.data.amplitude;

          for (let m = 0; m < this.maillages.length; m++) {
            const item = this.maillages[m];
            const arr = item.posAttr.array;
            const orig = item.original;

            for (let i = 0; i < arr.length; i += 3) {
              const ox = orig[i];
              const oy = orig[i + 1];
              const oz = orig[i + 2];

              const souplesse = Math.max(0, oy) * 0.25;
              const decalageCoin = ox * 0.8 + oz * 0.8;

              arr[i]     = ox + Math.sin(t - oy * 1.4 + decalageCoin) * amp * souplesse;
              arr[i + 1] = oy;
              arr[i + 2] = oz + Math.cos(t * 0.85 - oy * 1.2 + decalageCoin) * amp * souplesse;
            }
            item.posAttr.needsUpdate = true;
          }
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best; changeMatrixMode: modelViewMatrix;"
      vr-mode-ui="enabled: false"
      renderer="sortObjects: true; antialias: true; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true;"
      smooth="true"
      smoothCount="5"
      smoothTolerance=".05"
      smoothThreshold="5"
      sourceWidth="800"
      sourceHeight="600"
      displayWidth="1280"
      displayHeight="720">

      <a-assets>
        <a-asset-item id="tentacules-obj" src="tentacule.obj"></a-asset-item>
      </a-assets>

      <a-marker type="barcode" value="0">
        <a-light type="directional" intensity="1.4" position="2 4 2"></a-light>
        <a-light type="ambient" intensity="0.7"></a-light>

        <a-entity
          obj-model="obj: #tentacules-obj"
          position="0 0 0"
          scale="0.25 0.25 0.25"
          rotation="0 0 0"
          animer-tentacules-obj="couleur: #7b2cbf; vitesse: 2.5; amplitude: 0.35">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
